<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #121212;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
}

button {
    font: inherit;
    color: inherit;
    border: 0;
    outline: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
}

.screen {
    display: none;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;
    flex-direction: column;
    overflow: hidden;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)) 20px;
}

.screen.active {
    display: flex;
}

.home-screen,
.workout-screen {
    justify-content: center;
}

.home-content,
.workout-content {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
}

.main-title {
    margin: 0 0 10px;
    color: #39FF14;
    font-size: clamp(36px, 10vw, 58px);
    line-height: .95;
    font-weight: 900;
    letter-spacing: -2px;
    text-transform: uppercase;
}

.subtitle {
    margin: 0 0 32px;
    color: #8d8d8d;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.routine-list,
.workout-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
    width: 100%;
}

.routine-button {
    width: 100%;
    min-height: 72px;
    padding: 18px 22px;
    background: #1c1c1c;
    border: 1px solid #303030;
    border-radius: 14px;
    text-align: left;
    font-size: 20px;
    font-weight: 700;
    transition: .15s;
}

.routine-button:active,
.workout-button:active {
    background: #39FF14;
    border-color: #39FF14;
    color: #121212;
    transform: scale(.985);
}

.screen-header {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
}

.screen-label {
    margin: 0 0 7px;
    color: #39FF14;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.screen-title {
    margin: 0;
    font-size: clamp(32px, 8vw, 48px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: -1.5px;
    text-transform: uppercase;
}

.workout-list {
    margin-top: 34px;
    gap: 14px;
}

.workout-button {
    width: 100%;
    min-height: 82px;
    padding: 20px;
    background: #1c1c1c;
    border: 1px solid #303030;
    border-radius: 15px;
    font-size: 23px;
    font-weight: 800;
    text-align: center;
    transition: .15s;
}

.back-button {
    display: block;
    margin: 28px auto 0;
    padding: 12px 16px;
    background: transparent;
    color: #777777;
    font-size: 14px;
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 4px;
}

.back-button:active,
.cancel-button:active {
    color: #ffffff;
}

.exercise-screen {
    padding-top: max(18px, env(safe-area-inset-top));
}

.exercise-header,
.exercise-content {
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
}

.exercise-header {
    flex-shrink: 0;
}

.exercise-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.exercise-counter {
    color: #888888;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
}

.exercise-routine-name {
    color: #39FF14;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.progress-track {
    width: 100%;
    height: 6px;
    overflow: hidden;
    background: #2b2b2b;
    border-radius: 20px;
}

.progress-bar {
    width: 0;
    height: 100%;
    background: #39FF14;
    border-radius: 20px;
    transition: width .25s ease;
}

.exercise-content {
    display: flex;
    flex: 1;
    flex-direction: column;
    min-height: 0;
    padding-top: 17px;
}

.exercise-code {
    margin: 0 0 5px;
    color: #39FF14;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 2px;
}

.exercise-name {
    margin: 0;
    font-size: clamp(27px, 7.2vw, 44px);
    line-height: 1.02;
    font-weight: 900;
    letter-spacing: -1px;
}

.machine-container {
    display: flex;
    justify-content: center;
    align-items: center;
    flex: 1;
    min-height: 130px;
    max-height: 360px;
    margin: 12px 0;
    overflow: hidden;
    border: 1px solid #292929;
    border-radius: 18px;
    background: #191919;
}

.machine-image {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 150px;
    max-height: 340px;
    object-fit: cover;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    flex-shrink: 0;
    margin-bottom: 10px;
}

.stat {
    min-height: 62px;
    padding: 9px 5px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #1b1b1b;
    border: 1px solid #292929;
    border-radius: 10px;
    text-align: center;
}

.stat-label {
    margin-bottom: 5px;
    color: #777777;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.stat-value {
    color: #ffffff;
    font-size: 14px;
    font-weight: 800;
}

.record-panel { flex-shrink:0; margin-bottom:9px; padding:10px; background:#191919; border:1px solid #292929; border-radius:12px; }
.record-title { margin-bottom:7px; color:#39FF14; font-size:10px; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; }
.record-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.record-field { display:flex; align-items:center; gap:8px; min-width:0; color:#888; font-size:11px; font-weight:700; }
.record-field span { white-space:nowrap; }
.record-field input { width:100%; min-width:0; height:38px; padding:7px 9px; border:1px solid #333; border-radius:8px; outline:0; background:#111; color:#fff; font:inherit; }
.record-field input:focus { border-color:#39FF14; }
.save-status { margin-top:6px; color:#666; font-size:9px; text-align:right; }
.exercise-actions { flex-shrink:0; width:100%; }

.next-button,
.finish-button {
    width: 100%;
    min-height: 68px;
    padding: 16px 20px;
    background: #39FF14;
    color: #121212;
    border-radius: 14px;
    font-size: 19px;
    font-weight: 900;
    text-transform: uppercase;
}

.previous-button {
    width: 100%;
    min-height: 46px;
    margin-bottom: 6px;
    padding: 10px 16px;
    background: #1c1c1c;
    color: #ffffff;
    border: 1px solid #303030;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    text-transform: uppercase;
}

.previous-button:active {
    background: #2a2a2a;
    border-color: #39FF14;
    color: #39FF14;
}

.cancel-button {
    display: block;
    width: 100%;
    min-height: 42px;
    margin-top: 4px;
    padding: 8px;
    background: transparent;
    color: #777777;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.finish-screen {
    justify-content: center;
    align-items: center;
    text-align: center;
}

.finish-content {
    width: 100%;
    max-width: 500px;
}

.finish-title {
    margin: 0 0 35px;
    color: #39FF14;
    font-size: clamp(52px, 15vw, 92px);
    line-height: .9;
    font-weight: 900;
    letter-spacing: -4px;
}

.finish-button {
    font-size: 18px;
}

@media (min-width: 700px) {
    .screen {
        padding-left: 40px;
        padding-right: 40px;
    }
}

@media (max-height: 650px) {
    .screen {
        padding-top: max(12px, env(safe-area-inset-top));
        padding-bottom: max(12px, env(safe-area-inset-bottom));
    }

    .main-title {
        font-size: 38px;
        margin-bottom: 7px;
    }

    .subtitle {
        margin-bottom: 18px;
    }

    .routine-list {
        gap: 8px;
    }

    .routine-button {
        min-height: 55px;
        padding: 13px 17px;
        font-size: 17px;
    }

    .machine-container {
        min-height: 90px;
        margin: 7px 0;
    }

    .machine-image {
        min-height: 100px;
    }

    .stat {
        min-height: 52px;
        padding: 5px 3px;
    }

    .previous-button {
        min-height: 40px;
        margin-bottom: 4px;
        padding: 7px 12px;
    }

    .next-button {
        min-height: 58px;
    }

    .cancel-button {
        min-height: 34px;
    }
}

.exercise-details{
    width:100%;
    box-sizing:border-box;
    margin:14px 0 10px;
    padding:18px 16px;
    background:#191919;
    border:1px solid #333;
    border-radius:16px;
    text-align:left;
}
.detail-block + .detail-block{
    margin-top:16px;
    padding-top:16px;
    border-top:1px solid #2d2d2d;
}
.detail-label{
    margin:0 0 7px;
    color:#39FF14;
    font-size:12px;
    font-weight:900;
    letter-spacing:1.5px;
    text-transform:uppercase;
}
.detail-text{
    color:#f0f0f0;
    font-size:15px;
    line-height:1.5;
}
@media (max-width:430px){
    .exercise-details{
        margin:12px 0 8px;
        padding:17px 15px;
        border-radius:15px;
    }
    .detail-label{font-size:11px;margin-bottom:6px}
    .detail-text{font-size:14px;line-height:1.48}
}
@media (max-height:720px){
    .exercise-details{
        margin:8px 0 6px;
        padding:12px 13px;
    }
    .detail-block + .detail-block{
        margin-top:10px;
        padding-top:10px;
    }
    .detail-label{font-size:10px;margin-bottom:4px}
    .detail-text{font-size:12px;line-height:1.35}
}
</style>
</head>

<main id="homeScreen" class="screen active home-screen">

<section id="exerciseScreen" class="screen exercise-screen">

</div>

        <div id="statsGrid" class="stats-grid"></div>

            <button id="nextExerciseButton" class="next-button" type="button">

            </button>

            <button id="cancelExerciseButton" class="cancel-button" type="button">
                Volver a Workouts
            </button>
        </div>
    </div>
</section>

<section id="finishScreen" class="screen finish-screen">
    <div class="finish-content">
        <h1 class="finish-title">TERMINADO</h1>

        <button id="finishButton" class="finish-button" type="button">
            Volver al Inicio
        </button>
    </div>
</section>

let selectedRoutine = null;
let selectedWorkout = null;
let currentExerciseIndex = 0;

const homeScreen = document.getElementById("homeScreen");
const workoutScreen = document.getElementById("workoutScreen");
const exerciseScreen = document.getElementById("exerciseScreen");
const finishScreen = document.getElementById("finishScreen");

const routineList = document.getElementById("routineList");
const workoutList = document.getElementById("workoutList");
const workoutRoutineTitle = document.getElementById("workoutRoutineTitle");

const backToRoutinesButton = document.getElementById("backToRoutinesButton");

const exerciseCounter = document.getElementById("exerciseCounter");
const exerciseRoutineName = document.getElementById("exerciseRoutineName");
const progressBar = document.getElementById("progressBar");
const exerciseCode = document.getElementById("exerciseCode");
const exerciseName = document.getElementById("exerciseName");
const machineImage = document.getElementById("machineImage");
const statsGrid = document.getElementById("statsGrid");
const equipmentText = document.getElementById("equipmentText");
const instructionsText = document.getElementById("instructionsText");
const weightInput = document.getElementById("weightInput");
const setsInput = document.getElementById("setsInput");
const saveStatus = document.getElementById("saveStatus");

const previousExerciseButton = document.getElementById("previousExerciseButton");
const nextExerciseButton = document.getElementById("nextExerciseButton");
const cancelExerciseButton = document.getElementById("cancelExerciseButton");
const finishButton = document.getElementById("finishButton");

const fallbackImage =
    "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=1200&q=85";

function showScreen(screenToShow) {
    document.querySelectorAll(".screen").forEach(function(screen) {
        screen.classList.remove("active");
    });

    screenToShow.classList.add("active");
    window.scrollTo(0, 0);
}

function renderRoutines() {
    routineList.innerHTML = "";

    Object.keys(workoutDatabase).forEach(function(routineName) {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "routine-button";
        button.textContent = routineName;

        button.addEventListener("click", function() {
            selectRoutine(routineName);
        });

        routineList.appendChild(button);
    });
}

function selectRoutine(routineName) {
    selectedRoutine = routineName;
    selectedWorkout = null;
    currentExerciseIndex = 0;

    workoutRoutineTitle.textContent = routineName;

    renderWorkouts();
    showScreen(workoutScreen);
}

function renderWorkouts() {
    workoutList.innerHTML = "";

    Object.keys(workoutDatabase[selectedRoutine]).forEach(function(workoutName) {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "workout-button";
        button.textContent = workoutName;

        button.addEventListener("click", function() {
            startWorkout(workoutName);
        });

        workoutList.appendChild(button);
    });
}

function startWorkout(workoutName) {
    selectedWorkout = workoutName;
    currentExerciseIndex = 0;

    renderCurrentExercise();
    showScreen(exerciseScreen);
}

function getStats(exercise) {
    const name = exercise.name.toLowerCase();

    if (name.includes("hollow hold")) {
        return {
            series: "3",
            reps: "20-40 s",
            rest: "60 s",
            tempo: "Static",
            rir: "1-2",
            tut: "20-40 s"
        };
    }

    if (
        name.includes("mountain climber") ||
        name.includes("heel taps") ||
        name.includes("bicycle crunch")
    ) {
        return {
            series: "3",
            reps: "15-30",
            rest: "60 s",
            tempo: "Control",
            rir: "1-2",
            tut: "30-45 s"
        };
    }

    if (
        name.includes("dead bug") ||
        name.includes("w raises")
    ) {
        return {
            series: "3",
            reps: "10-15",
            rest: "60 s",
            tempo: "Control",
            rir: "1-2",
            tut: "30-45 s"
        };
    }

    if (
        name.includes("squat") ||
        name.includes("deadlift") ||
        name.includes("bench press") ||
        name.includes("hip thrust")
    ) {
        return {
            series: "3",
            reps: "6-10",
            rest: "120 s",
            tempo: "3-1-1-0",
            rir: "1-2",
            tut: "25-40 s"
        };
    }

    if (
        name.includes("press") ||
        name.includes("row") ||
        name.includes("pulldown") ||
        name.includes("pullover")
    ) {
        return {
            series: "3",
            reps: "8-12",
            rest: "90 s",
            tempo: "2-1-1-0",
            rir: "1-2",
            tut: "30-45 s"
        };
    }

    return {
        series: "3",
        reps: "10-15",
        rest: "60-90 s",
        tempo: "2-1-2-0",
        rir: "1-2",
        tut: "30-45 s"
    };
}

function getRecordKey(){ return "record|"+selectedRoutine+"|"+selectedWorkout+"|"+currentExerciseIndex; }
function loadExerciseRecord(){ let r=null; try{r=JSON.parse(localStorage.getItem(getRecordKey())||"null");}catch(e){} weightInput.value=r&&r.weight?r.weight:""; setsInput.value=r&&r.sets?r.sets:""; saveStatus.textContent=r?"Registro guardado":"Guardado automáticamente"; }
function saveExerciseRecord(){ try{localStorage.setItem(getRecordKey(),JSON.stringify({weight:weightInput.value.trim(),sets:setsInput.value.trim()}));saveStatus.textContent="Registro guardado";}catch(e){saveStatus.textContent="No se pudo guardar";} }

function renderCurrentExercise() {
    const exercises =
        workoutDatabase[selectedRoutine][selectedWorkout];

    const exercise =
        exercises[currentExerciseIndex];

    const total =
        exercises.length;

    const number =
        currentExerciseIndex + 1;

    exerciseCounter.textContent =
        number + " / " + total;

    exerciseRoutineName.textContent =
        selectedRoutine;

    progressBar.style.width =
        ((number / total) * 100) + "%";

    exerciseCode.textContent =
        exercise.code;

    exerciseName.textContent =
        exercise.name;

    machineImage.src =
        exercise.image || fallbackImage;

    machineImage.alt =
        exercise.name;

    const details = exerciseDetails[exercise.name];
    equipmentText.textContent = details ? details[0] : "Consultar material disponible.";
    instructionsText.textContent = details ? details[1] : "Ejecuta el movimiento de forma controlada.";

    loadExerciseRecord();

    const stats =
        getStats(exercise);

    statsGrid.innerHTML = "";

    [
        ["Series", stats.series],
        ["Repeticiones", stats.reps],
        ["Descanso", stats.rest],
        ["Tempo", stats.tempo],
        ["RIR", stats.rir],
        ["TUT", stats.tut]
    ].forEach(function(item) {
        const label = item[0];
        const value = item[1];

        const box =
            document.createElement("div");

        box.className =
            "stat";

        const labelElement =
            document.createElement("span");

        labelElement.className =
            "stat-label";

        labelElement.textContent =
            label;

        const valueElement =
            document.createElement("span");

        valueElement.className =
            "stat-value";

        valueElement.textContent =
            value;

        box.appendChild(labelElement);
        box.appendChild(valueElement);

        statsGrid.appendChild(box);
    });

    previousExerciseButton.disabled =
        currentExerciseIndex === 0;

    previousExerciseButton.style.opacity =
        currentExerciseIndex === 0 ? "0.35" : "1";

    if (currentExerciseIndex === total - 1) {
        nextExerciseButton.textContent =
            "Terminar Entrenamiento";
    } else {
        nextExerciseButton.textContent =
            "Siguiente Ejercicio";
    }
}

function previousExercise() {
    saveExerciseRecord();
    if (currentExerciseIndex === 0) {
        return;
    }

    currentExerciseIndex--;
    renderCurrentExercise();
}

function nextExercise() {
    saveExerciseRecord();
    const exercises =
        workoutDatabase[selectedRoutine][selectedWorkout];

    if (currentExerciseIndex === exercises.length - 1) {
        showScreen(finishScreen);
        return;
    }

    currentExerciseIndex++;
    renderCurrentExercise();
}

function cancelWorkout() {
    const confirmed =
        window.confirm(
            "¿Volver a la selección de workouts?"
        );

    if (!confirmed) {
        return;
    }

    selectedWorkout = null;
    currentExerciseIndex = 0;

    renderWorkouts();
    showScreen(workoutScreen);
}
function backToRoutines() {
    selectedRoutine = null;
    selectedWorkout = null;
    currentExerciseIndex = 0;

    showScreen(homeScreen);
}

function finishWorkout() {
    selectedRoutine = null;
    selectedWorkout = null;
    currentExerciseIndex = 0;

    showScreen(homeScreen);
}

weightInput.addEventListener("input", saveExerciseRecord);
setsInput.addEventListener("input", saveExerciseRecord);

previousExerciseButton.addEventListener(
    "click",
    previousExercise
);

nextExerciseButton.addEventListener(
    "click",
    nextExercise
);

cancelExerciseButton.addEventListener(
    "click",
    cancelWorkout
);

backToRoutinesButton.addEventListener(
    "click",
    backToRoutines
);

finishButton.addEventListener(
    "click",
    finishWorkout
);

machineImage.addEventListener(
    "error",
    function() {
        if (machineImage.src !== fallbackImage) {
            machineImage.src = fallbackImage;
        }
    }
);

renderRoutines();
showScreen(homeScreen);
</script>

</body>
</html>
